name: memoir
description: "A Flutter app for dementia assistance."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # 🌐 Localization
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  # 🔥 Firebase (STABLE COMBO)
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  firebase_auth: ^5.3.0
  cloud_firestore: ^5.4.0
  google_sign_in: ^6.2.1
  flutter_tts: ^3.8.5
  speech_to_text: ^7.0.0
  emoji_picker_flutter: ^3.1.0
  firebase_storage: ^12.1.3 
  # 🔔 Notifications
  flutter_local_notifications: ^17.0.0
  cached_network_image: ^3.4.1
  # 🌍 Networking
  http: ^1.2.0
  flutter_phone_direct_caller: ^2.1.1
  # 🎨 UI & Animations
  flutter_animate: ^4.5.2
  flutter_svg: ^2.2.0
  cupertino_icons: ^1.0.8
  carousel_slider: ^5.1.1
  permission_handler: ^11.3.1
  geolocator: ^12.0.0
  # 💾 Storage & Utilities
  shared_preferences: ^2.5.3
  sqflite: ^2.4.2
  path: ^1.9.1
  timezone: ^0.9.4
  

  # 🔗 External Services
  url_launcher: ^6.3.2
  image_picker: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/logo.png

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter/static/Inter_18pt-Medium.ttf

    - family: Forum
      fonts:
        - asset: assets/fonts/Forum/Forum-Regular.ttf

    - family: Raleway
      fonts:
        - asset: assets/fonts/Raleway/static/Raleway-Regular.ttf

    - family: NataSans
      fonts:
        - asset: assets/fonts/Nata_Sans/static/NataSans-Regular.ttf

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"




